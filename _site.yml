
# --- General options --- #

# Name of website
title: Dr. Liyuan He's personal website
description: A blog recording updates and research interests


# --- Navigation bar options --- #

output_dir: "."

# List of links in the navigation bar
navbar:
    title: "Dr. Liyuan He"
    left:
      - text: "Home"
        href: index.qmd
      - text: "My Research"
        href: myresearch.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Opportunities"
        href: opportunities.qmd
      - text: "Contact Me"
        href: contactme.qmd


# Image to show in the navigation bar - image must be a square (width = height)

avatar: "/img/me.jpg"


format:
  html:
    theme: cosmo
    css: styles.css
    toc: False
    page-layout: full
    
#----Background Color/Image Options----#

navbar-col: "#F5F5F5"
navbar-text-col: "#404040"
navbar-children-col: "#F5F5F5"
page-col: "#FFFFFF"
link-col: "#008AFF"
hover-col: "#0085A1"
footer-col: "#F5F5F5"
footer-text-col: "#777777"
footer-link-col: "#404040"

